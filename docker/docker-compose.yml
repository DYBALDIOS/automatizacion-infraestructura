# Equivalente en Docker Compose de la infraestructura definida en Terraform
# (sirve como comparación; usar puerto 8080 para no chocar con Terraform)
services:
  web:
    image: nginx:alpine
    container_name: compose-web
    ports:
      - "8080:80"
    networks:
      red-iac:
        ipv4_address: 10.10.0.10

  app:
    image: python:3.12-alpine
    container_name: compose-app
    command: python -m http.server 8000
    networks:
      red-iac:
        ipv4_address: 10.10.0.20
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: compose-db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: LabPassword123
      POSTGRES_DB: appdb
    networks:
      red-iac:
        ipv4_address: 10.10.0.30

networks:
  red-iac:
    name: red-iac-compose
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
